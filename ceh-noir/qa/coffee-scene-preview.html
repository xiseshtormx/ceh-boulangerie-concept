<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЦЕХ — photo coffee QA</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;background:#000;color:#eee;font:14px system-ui}main{height:calc(100svh - 74px);min-height:420px}canvas{display:block;width:100%;height:100%}nav{position:fixed;bottom:0;left:0;width:100%;height:74px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;background:#111}button{border:1px solid #444;border-radius:6px;background:#191919;color:#fff;padding:10px 14px;cursor:pointer}button[aria-pressed=true]{background:#eee;color:#000}input{width:180px}output{font-variant-numeric:tabular-nums;width:45px}pre{position:fixed;top:0;left:0;padding:18px;color:#fba;background:#200;max-width:100%;white-space:pre-wrap;z-index:2}pre:empty{display:none}@media(max-width:680px){nav{gap:5px;flex-wrap:wrap;height:112px}button{padding:9px}main{height:calc(100svh - 112px)}input{width:65%}}
</style>
<main><canvas id="scene" aria-label="Чашка и кофе из предоставленных изображений"></canvas></main>
<nav aria-label="Кадры анимации">
  <button data-p="0">Начало</button><button data-p=".195">Наклон</button><button data-p=".45">Налив</button><button data-p=".70">Пенка</button><button data-p=".78">Возврат</button><button data-p="1">Финал</button>
  <input id="scrub" aria-label="Прогресс" type="range" min="0" max="1" step=".001" value="1"><output>1.00</output>
</nav>
<pre id="error"></pre>
<script type="module">
  import {createCoffeeScene} from '../coffee-scene.js';
  const canvas=document.querySelector('canvas'), error=document.querySelector('#error'), scrub=document.querySelector('#scrub'), output=document.querySelector('output');
  let scene, progress=Number(new URLSearchParams(location.search).get('p')??1), ambient=0;
  function draw(){try{scene?.render({progress,time:progress*16,ambientTime:ambient});output.value=progress.toFixed(2);scrub.value=progress;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.p)===progress))}catch(e){error.textContent=e.stack||e.message;window.__coffeeError=String(e)}}
  function resize(){scene?.resize({width:canvas.clientWidth,height:canvas.clientHeight,dpr:devicePixelRatio,mobile:innerWidth<700});draw()}
  try{scene=await createCoffeeScene(canvas,{lowPower:new URLSearchParams(location.search).has('low')});window.__coffeeScene=scene;resize();window.__coffeeReady=true}catch(e){error.textContent=e.stack||e.message;window.__coffeeError=String(e)}
  document.querySelectorAll('button').forEach(b=>b.onclick=()=>{progress=Number(b.dataset.p);draw()});scrub.oninput=()=>{progress=Number(scrub.value);draw()};window.addEventListener('resize',resize);
  window.setCoffeeProgress=p=>{progress=Number(p);draw()};
</script>
</html>
